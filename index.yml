<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLADE SMP | Kış Temalı Hayatta Kalma Sunucusu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Arka Plan Buz Efekti */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a2639 0%, #0b0f19 100%);
            z-index: -1;
        }

        .container {
            text-align: center;
            padding: 20px;
            z-index: 1;
            max-width: 800px;
        }

        /* BLADE SMP Renkli Small Caps Başlık Tasarımı */
        .logo-text {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 4px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .b { color: #FF0000; text-shadow: 0 0 15px rgba(255, 0, 0, 0.6); }
        .l { color: #FF1100; text-shadow: 0 0 15px rgba(255, 17, 0, 0.6); }
        .a { color: #FF2200; text-shadow: 0 0 15px rgba(255, 34, 0, 0.6); }
        .d { color: #FF3200; text-shadow: 0 0 15px rgba(255, 50, 0, 0.6); }
        .e { color: #FF4300; text-shadow: 0 0 15px rgba(255, 67, 0, 0.6); }
        .s { color: #FF6500; text-shadow: 0 0 15px rgba(255, 101, 0, 0.6); }
        .m { color: #FF7500; text-shadow: 0 0 15px rgba(255, 117, 0, 0.6); }
        .p { color: #FF8600; text-shadow: 0 0 15px rgba(255, 134, 0, 0.6); }

        .subtitle {
            font-size: 1.2rem;
            color: #a4e5ff;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        /* IP Kopyalama Kutusu */
        .ip-box {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(164, 229, 255, 0.3);
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-block;
            margin-bottom: 30px;
            box-shadow: 0 0 20px rgba(164, 229, 255, 0.1);
        }

        .ip-box:hover {
            background: rgba(164, 229, 255, 0.1);
            border-color: #a4e5ff;
            transform: translateY(-3px);
            box-shadow: 0 0 25px rgba(164, 229, 255, 0.3);
        }

        /* Butonlar Alanı */
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            background: linear-gradient(135deg, #FF0000, #FF8600);
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 134, 0, 0.6);
        }

        .btn-discord {
            background: #5865F2;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4);
        }

        .btn-discord:hover {
            box-shadow: 0 6px 20px rgba(88, 101, 242, 0.6);
        }

        /* Bilgi Kartları */
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 50px;
            width: 100%;
            max-width: 800px;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 20px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
        }

        .card h3 {
            color: #a4e5ff;
            margin-bottom: 10px;
        }

        .card p {
            color: #b0c4de;
            font-size: 0.9rem;
        }

        /* Kopyalandı Bildirimi */
        #copy-alert {
            margin-top: 15px;
            color: #a4e5ff;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Başlık -->
        <h1 class="logo-text">
            <span class="b">ʙ</span><span class="l">ʟ</span><span class="a">ᴀ</span><span class="d">ᴅ</span><span class="e">ᴇ</span> 
            <span class="s">ѕ</span><span class="m">ᴍ</span><span class="p">ᴘ</span>
        </h1>
        <p class="subtitle">❄️ Kış Temalı İllegal Hayatta Kalma Deneyimi ❄️</p>

        <!-- IP Kopyalama Alanı (IP'ni buraya yazabilirsin) -->
        <div class="ip-box" onclick="copyIP()">
            <span>oyna.bladesmp.com</span>
        </div>
        <div id="copy-alert">IP adresi panoya kopyalandı!</div>

        <!-- Sosyal / Discord Butonları -->
        <div class="btn-group">
            <a href="https://discord.gg/senindiscordun" target="_blank" class="btn btn-discord">Discord Sunucumuz</a>
            <a href="#ozellikler" class="btn">Özellikler</a>
        </div>

        <!-- Özellikler Kartları -->
        <div class="features" id="ozellikler">
            <div class="card">
                <h3>❄️ Kar Silahları</h3>
                <p>Özel kodlanmış Kar Gürzü, Mızrağı ve Kılıcı ile rakiplerine buz dondurucu darbeler vur.</p>
            </div>
            <div class="card">
                <h3>⛏️ İllegal Yıkım</h3>
                <p>Kar Yıkım Aleti ile sol tıkla 4x4 alanları anında darmadağın et.</p>
            </div>
            <div class="card">
                <h3>🛡️ Güvenli Spawn</h3>
                <p>WorldGuard ile korunan, PvP ve patlamaların kapalı olduğu huzurlu başlangıç bölgesi.</p>
            </div>
        </div>
    </div>

    <script>
        function copyIP() {
            navigator.clipboard.writeText("oyna.bladesmp.com");
            const alertBox = document.getElementById("copy-alert");
            alertBox.style.opacity = "1";
            setTimeout(() => {
                alertBox.style.opacity = "0";
            }, 2000);
        }
    </script>
</body>
</html>
