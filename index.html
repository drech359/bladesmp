<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLADE SMP | Profesyonel SMP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #050505;
            color: #ffffff;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }
        
        /* Genel Bölüm Düzeni */
        section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 0, 0, 0.1);
        }

        /* 1. BÖLÜM: ANA GİRİŞ & IP */
        .logo {
            font-size: 4.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #FF0000, #FF6500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 0, 0, 0.4);
            letter-spacing: 3px;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #ff8600;
            font-size: 1.3rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }
        .ip-box {
            background: rgba(20, 5, 5, 0.9);
            border: 2px solid #FF0000;
            padding: 25px 50px;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.3);
        }
        .ip-box:hover {
            background: rgba(255, 0, 0, 0.2);
            transform: scale(1.05);
            border-color: #FF6500;
        }
        .ip-title {
            font-size: 0.9rem;
            color: #ff8600;
            margin-bottom: 8px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .ip-address {
            font-size: 1.6rem;
            font-weight: bold;
            color: #fff;
            letter-spacing: 1px;
        }
        .scroll-down {
            margin-top: 50px;
            color: #777;
            font-size: 0.9rem;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-10px);}
            60% {transform: translateY(-5px);}
        }

        /* 2. BÖLÜM: SOSYAL MEDYA (DISCORD & YOUTUBE) */
        .social-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 30px;
        }
        .social-btn {
            background: rgba(20, 20, 20, 0.8);
            border: 2px solid #FF4300;
            padding: 20px 35px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            color: #fff;
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 15px rgba(255, 67, 0, 0.2);
            text-decoration: none;
        }
        .social-btn:hover {
            background: rgba(255, 67, 0, 0.2);
            transform: translateY(-5px);
            border-color: #FF0000;
        }

        /* 3. BÖLÜM: TANITIM VE KURALLAR */
        .info-container {
            max-width: 900px;
            text-align: left;
            background: rgba(15, 15, 15, 0.8);
            border: 1px solid rgba(255, 0, 0, 0.3);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.8);
        }
        .info-container h2 {
            color: #FF4300;
            font-size: 2rem;
            margin-bottom: 20px;
            text-align: center;
            text-transform: uppercase;
        }
        .info-container h3 {
            color: #ff8600;
            margin-top: 25px;
            margin-bottom: 10px;
            font-size: 1.3rem;
            border-bottom: 1px solid rgba(255, 134, 0, 0.2);
            padding-bottom: 5px;
        }
        .info-container p, .info-container li {
            color: #ccc;
            font-size: 1.05rem;
            line-height: 1.7;
            margin-bottom: 10px;
        }
        .info-container ul {
            padding-left: 20px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #555;
            font-size: 0.85rem;
            background: #020202;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }

        /* Bildirim Kutusu (Kopyalandı Uyarısı) */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #FF0000;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 16px;
            position: fixed;
            z-index: 1;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        #toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }
        @keyframes fadein {from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;}}
        @keyframes fadeout {from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;}}
    </style>
</head>
